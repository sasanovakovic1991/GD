<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VodoPro Studio | Ponude, Racuni, Lager</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #2563eb;
      --accent-2: #14b8a6;
      --danger: #dc2626;
      --ok: #16a34a;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    body[data-theme="dark"] {
      --bg: #0b1220;
      --card: #101827;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --line: #1f2937;
      --accent: #3b82f6;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --ok: #22c55e;
      --shadow: 0 20px 40px rgba(2, 6, 23, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.5;
      transition: background 0.35s ease, color 0.35s ease;
    }
    body.size-lg { font-size: 20px; }
    body.size-lg .btn { padding: 14px 18px; }
    body.size-lg input, body.size-lg select, body.size-lg textarea { padding: 12px 14px; }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 14px 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }
    body[data-theme="dark"] header {
      background: rgba(16, 24, 39, 0.88);
    }
    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 700;
      font-size: 20px;
      display: grid;
      place-items: center;
      letter-spacing: 0.5px;
      overflow: hidden;
    }
    .logo.has-image {
      background: transparent;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-title { font-weight: 700; font-size: 20px; }
    .brand-sub { color: var(--muted); font-size: 14px; }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    main {
      flex: 1;
      padding: 20px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 80px;
    }

    .tabs {
      position: sticky;
      top: 86px;
      z-index: 40;
      background: var(--bg);
      padding: 10px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      transition: background 0.35s ease;
    }
    .tab {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    .tab.active {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    .view { display: none; }
    .view.active { display: block; }

    .grid {
      display: grid;
      gap: 16px;
    }
    .grid.two { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid.three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, color 0.35s ease;
    }
    .card h2, .card h3 { margin: 0 0 12px 0; }
    .muted { color: var(--muted); }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
    }
    .btn.primary { background: var(--accent); color: white; border-color: transparent; }
    .btn.accent { background: var(--accent-2); color: #052e2b; border-color: transparent; }
    .btn.danger { background: var(--danger); color: white; border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 8px 12px; font-size: 0.9rem; min-height: 36px; }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--card);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    textarea { min-height: 90px; resize: vertical; }
    label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 4px; }

    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row.align { align-items: center; }
    .row.space { justify-content: space-between; }
    .divider { border-top: 1px solid var(--line); margin: 12px 0; }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }
    .list-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: var(--bg);
      display: grid;
      gap: 8px;
    }
    .list-item h4 { margin: 0; }

    .badge {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge.ok { background: rgba(22, 163, 74, 0.15); color: var(--ok); }
    .badge.warn { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge.danger { background: rgba(220, 38, 38, 0.2); color: var(--danger); }

    .stat {
      display: grid;
      gap: 6px;
    }
    .stat .value { font-size: 28px; font-weight: 700; }

    .bar {
      background: var(--line);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .shop-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: var(--card);
      display: grid;
      gap: 10px;
    }
    .shop-image {
      height: 120px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(20, 184, 166, 0.2));
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--accent);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.hidden { display: none; }
    .modal-card {
      background: var(--card);
      border-radius: 20px;
      max-width: 760px;
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header .close-btn { border-radius: 999px; }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem;
    }
    .switch input { display: none; }
    .switch .slider {
      width: 54px;
      height: 30px;
      border-radius: 999px;
      background: var(--line);
      position: relative;
      transition: background 0.3s ease;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }
    .switch .slider::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      top: 3px;
      left: 3px;
      border-radius: 50%;
      background: var(--card);
      transition: transform 0.3s ease, background 0.3s ease;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.2);
    }
    .switch input:checked + .slider {
      background: var(--accent);
    }
    .switch input:checked + .slider::after {
      transform: translateX(24px);
    }
    .switch-text { color: var(--muted); font-weight: 600; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: none;
    }
    .toast.show { display: block; }

    @media (max-width: 880px) {
      header { flex-direction: column; align-items: flex-start; }
      .tabs { top: 144px; }
      main { margin-bottom: 120px; }
    }
    @media (max-width: 640px) {
      .tabs { position: static; }
      main { padding: 16px; }
      header { padding: 12px 16px; }
      .brand-title { font-size: 18px; }
      .brand-sub { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" id="companyLogo">VP</div>
        <div>
          <div class="brand-title" id="companyName">VodoPro Studio</div>
          <div class="brand-sub">Ponude, racuni, lager, webshop i analiza</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" data-action="new-offer">Nova ponuda</button>
        <button class="btn primary" data-action="new-invoice">Novi racun</button>
        <button class="btn" data-action="open-settings">Postavke</button>
        <label class="switch" title="Tema">
          <input type="checkbox" id="theme_toggle" />
          <span class="slider"></span>
          <span class="switch-text" id="theme_label">Svijetla</span>
        </label>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-action="switch-view" data-view="dashboard">Pocetna</button>
      <button class="tab" data-action="switch-view" data-view="offers">Ponude</button>
      <button class="tab" data-action="switch-view" data-view="invoices">Racuni</button>
      <button class="tab" data-action="switch-view" data-view="customers">Kupci</button>
      <button class="tab" data-action="switch-view" data-view="jobs">Projekti</button>
      <button class="tab" data-action="switch-view" data-view="inventory">Lager</button>
      <button class="tab" data-action="switch-view" data-view="analysis">Analiza</button>
      <button class="tab" data-action="switch-view" data-view="compare">Usporedba</button>
      <button class="tab" data-action="switch-view" data-view="packages">Paketi</button>
      <button class="tab" data-action="switch-view" data-view="shop">Webshop</button>
    </nav>

    <main>
      <section id="view-dashboard" class="view active"></section>
      <section id="view-offers" class="view"></section>
      <section id="view-invoices" class="view"></section>
      <section id="view-customers" class="view"></section>
      <section id="view-jobs" class="view"></section>
      <section id="view-inventory" class="view"></section>
      <section id="view-analysis" class="view"></section>
      <section id="view-compare" class="view"></section>
      <section id="view-packages" class="view"></section>
      <section id="view-shop" class="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Postavke</h3>
        <button class="btn small close-btn" data-action="close-modal">Zatvori ✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const $ = (s, root = document) => root.querySelector(s);
    const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
    const STORAGE_KEY = "vodopro.v1";

    const defaultProjects = [
      {
        id: uid(),
        name: "Centralno grijanje - stan do 70m2",
        description: "Standardni paket za stan s centralnim grijanjem.",
        tiers: {
          basic: [
            { name: "PVC cijev 20mm", qty: 80, unit: "m", price: 2.2 },
            { name: "Radijator 1200mm", qty: 5, unit: "kom", price: 95 },
            { name: "Kombi bojler 24kW", qty: 1, unit: "kom", price: 820 },
            { name: "Termostatska glava", qty: 5, unit: "kom", price: 12 }
          ],
          standard: [
            { name: "PEX-AL-PEX cijev 20mm", qty: 80, unit: "m", price: 3.2 },
            { name: "Radijator 1200mm", qty: 6, unit: "kom", price: 95 },
            { name: "Kombi bojler 24kW", qty: 1, unit: "kom", price: 820 },
            { name: "Termostatska glava", qty: 6, unit: "kom", price: 12 }
          ],
          premium: [
            { name: "Nehrdajuca cijev 20mm", qty: 80, unit: "m", price: 4.5 },
            { name: "Radijator 1200mm", qty: 7, unit: "kom", price: 95 },
            { name: "Kondenzacijski bojler 24kW", qty: 1, unit: "kom", price: 980 },
            { name: "Mjesac ventila set", qty: 1, unit: "set", price: 110 }
          ]
        }
      },
      {
        id: uid(),
        name: "Kupaonica - sanitarije komplet",
        description: "Paket sanitarija s vise rangova opreme.",
        tiers: {
          basic: [
            { name: "WC set osnovni", qty: 1, unit: "kom", price: 140 },
            { name: "Slavina za sudoper", qty: 1, unit: "kom", price: 65 },
            { name: "Tus komplet", qty: 1, unit: "kom", price: 98 }
          ],
          standard: [
            { name: "WC set kvalitetni", qty: 1, unit: "kom", price: 220 },
            { name: "Slavina za sudoper", qty: 1, unit: "kom", price: 65 },
            { name: "Tus komplet", qty: 1, unit: "kom", price: 98 }
          ],
          premium: [
            { name: "WC set kvalitetni", qty: 1, unit: "kom", price: 220 },
            { name: "Slavina za sudoper", qty: 2, unit: "kom", price: 65 },
            { name: "Tus komplet", qty: 1, unit: "kom", price: 98 },
            { name: "Mjesac ventila set", qty: 1, unit: "set", price: 110 }
          ]
        }
      }
    ];

    const defaultBundles = [
      {
        id: uid(),
        name: "Sanitarni paket Standard",
        category: "Sanitarije",
        price: 690,
        description: "Paket za brzo opremanje kupaonice.",
        items: ["WC set kvalitetni", "Daska soft-close", "Tus sistem", "Slavina za sudoper"],
        image: ""
      }
    ];

    const seedData = {
      settings: {
        company: {
          name: "VodoPro Servis",
          address: "Primjer ulica 1, 10000 Zagreb",
          oib: "12345678901",
          iban: "HR1210010051863000160",
          phone: "+385 91 000 0000",
          email: "info@vodopro.hr",
          logo: ""
        },
        vatRate: 25,
        paymentDays: 8,
        lowStock: 5,
        invoiceSeq: 1,
        offerSeq: 1,
        autoStock: true,
        theme: "light",
        largeText: true,
        fiscal: {
          office: "PP1",
          device: "UR1",
          operator: "Operater",
          operatorOib: "",
          paymentMethod: "Transakcijski racun"
        }
      },
      inventory: [
        { id: uid(), name: "PEX-AL-PEX cijev 20mm", category: "Cijevi", unit: "m", stock: 280, cost: 1.6, price: 3.2, webshop: false, tier: "standard", sku: "PEX20" },
        { id: uid(), name: "PVC cijev 20mm", category: "Cijevi", unit: "m", stock: 320, cost: 1.1, price: 2.2, webshop: false, tier: "basic", sku: "PVC20" },
        { id: uid(), name: "Nehrdajuca cijev 20mm", category: "Cijevi", unit: "m", stock: 140, cost: 2.4, price: 4.5, webshop: false, tier: "premium", sku: "INOX20" },
        { id: uid(), name: "Kondenzacijski bojler 24kW", category: "Grijanje", unit: "kom", stock: 6, cost: 680, price: 980, webshop: false, tier: "premium", sku: "BOJ24" },
        { id: uid(), name: "Kombi bojler 24kW", category: "Grijanje", unit: "kom", stock: 5, cost: 520, price: 820, webshop: false, tier: "standard", sku: "KMB24" },
        { id: uid(), name: "Radijator 1200mm", category: "Grijanje", unit: "kom", stock: 24, cost: 55, price: 95, webshop: false, tier: "standard", sku: "RAD1200" },
        { id: uid(), name: "Termostatska glava", category: "Regulacija", unit: "kom", stock: 80, cost: 6.5, price: 12, webshop: true, tier: "standard", sku: "TH01" },
        { id: uid(), name: "Mjesac ventila set", category: "Regulacija", unit: "set", stock: 12, cost: 58, price: 110, webshop: false, tier: "premium", sku: "MIX01" },
        { id: uid(), name: "WC set kvalitetni", category: "Sanitarije", unit: "kom", stock: 9, cost: 120, price: 220, webshop: true, tier: "premium", sku: "WC99" },
        { id: uid(), name: "WC set osnovni", category: "Sanitarije", unit: "kom", stock: 14, cost: 70, price: 140, webshop: true, tier: "basic", sku: "WC10" },
        { id: uid(), name: "Slavina za sudoper", category: "Sanitarije", unit: "kom", stock: 18, cost: 28, price: 65, webshop: true, tier: "standard", sku: "SL01" },
        { id: uid(), name: "Tus komplet", category: "Sanitarije", unit: "kom", stock: 11, cost: 48, price: 98, webshop: true, tier: "standard", sku: "TUS01" }
      ],
      offers: [],
      invoices: [],
      orders: [],
      customers: [],
      customerEvents: [],
      reminders: [],
      supplierCatalog: [],
      jobs: [],
      projects: defaultProjects,
      bundles: defaultBundles
    };

    const initialData = loadData();

    let state = {
      data: initialData,
      view: "dashboard",
      draftOffer: createOfferDraft(initialData),
      draftInvoice: createInvoiceDraft(initialData),
      draftBundle: createBundleDraft(),
      cart: [],
      shopQuery: "",
      shopCategory: "all",
      selectedProjectId: initialData.projects?.[0]?.id || "",
      selectedCustomerId: initialData.customers?.[0]?.id || "",
      selectedJobId: initialData.jobs?.[0]?.id || "",
      editTiers: false
    };

    function uid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "id_" + Math.random().toString(36).slice(2, 9);
    }

    function clone(obj) {
      if (typeof structuredClone === "function") return structuredClone(obj);
      return JSON.parse(JSON.stringify(obj));
    }

    function normalizeData(data) {
      const base = clone(seedData);
      const normalized = { ...base, ...data };
      normalized.settings = { ...base.settings, ...(data?.settings || {}) };
      normalized.settings.company = { ...base.settings.company, ...(data?.settings?.company || {}) };
      normalized.settings.fiscal = { ...base.settings.fiscal, ...(data?.settings?.fiscal || {}) };
      normalized.inventory = Array.isArray(data?.inventory) ? data.inventory : base.inventory;
      normalized.offers = Array.isArray(data?.offers) ? data.offers : [];
      normalized.invoices = Array.isArray(data?.invoices) ? data.invoices : [];
      normalized.orders = Array.isArray(data?.orders) ? data.orders : [];
      normalized.customers = Array.isArray(data?.customers) ? data.customers : [];
      normalized.customerEvents = Array.isArray(data?.customerEvents) ? data.customerEvents : [];
      normalized.reminders = Array.isArray(data?.reminders) ? data.reminders : [];
      normalized.supplierCatalog = Array.isArray(data?.supplierCatalog) ? data.supplierCatalog : [];
      normalized.jobs = Array.isArray(data?.jobs) ? data.jobs : [];
      normalized.projects = Array.isArray(data?.projects) ? data.projects : base.projects;
      normalized.bundles = Array.isArray(data?.bundles) ? data.bundles : base.bundles;

      normalized.inventory = normalized.inventory.map((item) => {
        const cost = Number(item.cost || 0);
        const price = Number(item.price || 0);
        const supplierDiscountPct = Number(item.supplierDiscountPct || 0);
        const netCost = cost * (1 - supplierDiscountPct / 100);
        const marginPct = Number(item.marginPct);
        const computedMargin = netCost > 0 ? ((price - netCost) / netCost) * 100 : 0;
        return {
          ...item,
          code: item.code || item.itemCode || item.sku || "",
          brand: item.brand || "",
          catalogNo: item.catalogNo || item.catalog || "",
          groupName: item.groupName || item.group || item.category || "Ostalo",
          unit: item.unit || "kom",
          minQty: Number(item.minQty || 0),
          maxQty: Number(item.maxQty || 0),
          supplierDiscountPct,
          cost,
          price,
          marginPct: Number.isFinite(marginPct) ? marginPct : Math.max(0, Math.round(computedMargin * 10) / 10)
        };
      });
      normalized.customers = normalized.customers.map((customer) => ({
        id: customer.id || uid(),
        name: customer.name || "Kupac",
        oib: customer.oib || "",
        address: customer.address || "",
        phone: customer.phone || "",
        email: customer.email || "",
        notes: customer.notes || "",
        createdAt: customer.createdAt || new Date().toISOString()
      }));
      normalized.jobs = normalized.jobs.map((job) => ({
        id: job.id || uid(),
        name: job.name || "Projekt",
        customerId: job.customerId || "",
        address: job.address || "",
        status: job.status || "Planiranje",
        notes: job.notes || "",
        images: Array.isArray(job.images) ? job.images : [],

      }));
      normalized.reminders = normalized.reminders.map((reminder) => ({
        id: reminder.id || uid(),

        dueDate: reminder.dueDate || "",

      }));
      normalized.supplierCatalog = normalized.supplierCatalog.map((item) => ({

        name: item.name || "",
        sku: item.sku || "",

        marginPct: Number(item.marginPct || 0),
        planQty: Number(item.planQty || 0),
        leadTime: item.leadTime || "",
        notes: item.notes || ""
      }));
      return normalized;
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return normalizeData({});
      try {
        const parsed = JSON.parse(raw);
        return normalizeData(parsed);
      } catch (err) {
        console.warn("Bad data, using seed", err);
        return normalizeData({});
      }
    }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));

    function nextOfferNumber(commit = true, data = state?.data) {
      const settings = data?.settings || seedData.settings;
      const year = new Date().getFullYear();
      const seq = settings.offerSeq || 1;
      const num = `${year}-P${String(seq).padStart(4, "0")}`;
      if (commit && state?.data && data === state.data) {
        settings.offerSeq = seq + 1;
        saveData();
      }
      return num;
    }

    function nextInvoiceNumber(commit = true, data = state?.data) {
      const settings = data?.settings || seedData.settings;
      const year = new Date().getFullYear();
      const seq = settings.invoiceSeq || 1;
      const num = `${year}-R${String(seq).padStart(4, "0")}`;
      if (commit && state?.data && data === state.data) {
        settings.invoiceSeq = seq + 1;
        saveData();
      }
      return num;
    }

    function finalizeOfferNumber(number) {
      const settings = state.data.settings;
      const year = new Date().getFullYear();
      const seq = settings.offerSeq || 1;
      const fallback = `${year}-P${String(seq).padStart(4, "0")}`;
      settings.offerSeq = seq + 1;
      return number || fallback;
    }

    function finalizeInvoiceNumber(number) {
      const settings = state.data.settings;
      const year = new Date().getFullYear();
      const seq = settings.invoiceSeq || 1;
      const fallback = `${year}-R${String(seq).padStart(4, "0")}`;
      settings.invoiceSeq = seq + 1;
      return number || fallback;
    }

    function fmtEur(value) {
      return new Intl.NumberFormat("hr-HR", { style: "currency", currency: "EUR" }).format(value || 0);
    }

    function calcTotals(items, discount, vatRate, rebatePct) {
      const subtotal = items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.price) || 0), 0);
      const discountValue = Math.max(0, Number(discount) || 0);
      const rebateValue = subtotal * (Math.max(0, Number(rebatePct) || 0) / 100);
      const base = Math.max(0, subtotal - rebateValue - discountValue);
      const vat = base * (Number(vatRate) || 0) / 100;
      const total = base + vat;
      return { subtotal, rebateValue, discountValue, base, vat, total };
    }

    function updateInventoryItem(item, field, rawValue) {
      const toNumber = (value) => {
        if (typeof value === "number") return value;
        const cleaned = String(value || "").replace(",", ".").replace(/[^0-9.\-]/g, "");
        return Number(cleaned) || 0;
      };
      const costNet = () => {
        const cost = Number(item.cost || 0);
        const discount = Number(item.supplierDiscountPct || 0);
        return cost * (1 - discount / 100);
      };
      if (field === "webshop") {
        item.webshop = rawValue === "true";
        return;
      }
      if (field === "stock") item.stock = toNumber(rawValue);
      if (field === "cost") item.cost = toNumber(rawValue);
      if (field === "price") item.price = toNumber(rawValue);
      if (field === "supplierDiscountPct") item.supplierDiscountPct = toNumber(rawValue);
      if (field === "minQty") item.minQty = toNumber(rawValue);
      if (field === "maxQty") item.maxQty = toNumber(rawValue);
      if (field === "code" || field === "brand" || field === "catalogNo" || field === "groupName" || field === "unit") {
        item[field] = rawValue;
        if (field === "groupName" && !item.category) item.category = rawValue;
        return;
      }
      if (field === "marginPct") {
        item.marginPct = toNumber(rawValue);
        const net = costNet();
        item.price = net > 0 ? net * (1 + item.marginPct / 100) : item.price;
        return;
      }
      if (field === "cost" || field === "price" || field === "supplierDiscountPct") {
        const net = costNet();
        const price = Number(item.price || 0);
        item.marginPct = net > 0 ? Math.round(((price - net) / net) * 1000) / 10 : 0;
      }
    }

    function getInvoicePaymentStats(inv) {
      const totals = calcTotals(inv.items || [], inv.discount, inv.vatRate, inv.rebatePct || 0);
      const payments = Array.isArray(inv.payments) ? inv.payments : [];
      const paidAmount = payments.length
        ? payments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0)
        : (inv.paid ? totals.total : 0);
      const outstanding = Math.max(0, totals.total - paidAmount);
      const status = paidAmount >= totals.total ? "Placeno" : (paidAmount > 0 ? "Djelomicno" : "Neplaceno");
      return { totals, paidAmount, outstanding, status };
    }

    function buildInvoiceMonthlySeries() {
      const map = {};
      state.data.invoices.forEach(inv => {
        const key = (inv.date || "").slice(0, 7) || "Nepoznato";
        const stats = getInvoicePaymentStats(inv);
        if (!map[key]) map[key] = { invoiced: 0, paid: 0 };
        map[key].invoiced += stats.totals.total;
        map[key].paid += stats.paidAmount;
      });
      const keys = Object.keys(map).sort();
      return {
        labels: keys,
        invoiced: keys.map(k => map[k].invoiced),
        paid: keys.map(k => map[k].paid)
      };
    }

        oib: $("#new_customer_oib").value.trim(),
        address: $("#new_customer_address").value.trim(),
        phone: $("#new_customer_phone").value.trim(),

        notes: $("#new_customer_notes").value.trim(),
        createdAt: new Date().toISOString()
      };
      state.data.customers.push(customer);
      state.selectedCustomerId = customer.id;
      saveData();
      render();
    }

    function selectCustomer(id) {
      state.selectedCustomerId = id;
      render();
    }

    function deleteCustomer(id) {
      if (!confirm("Obrisati kupca?")) return;
      state.data.customers = state.data.customers.filter(c => c.id !== id);
      state.data.customerEvents = state.data.customerEvents.filter(e => e.customerId !== id);
      if (state.selectedCustomerId === id) {
        state.selectedCustomerId = state.data.customers[0]?.id || "";
      }
      saveData();
      render();
    }

    function addCustomerEventManual() {
      const customer = getSelectedCustomer();
      if (!customer) return;
      const type = $("#event_type").value;
      const note = $("#event_note").value.trim();
      addCustomerEvent(customer.id, type, note);
      saveData();
      $("#event_note").value = "";
      render();
    }

    function buildReminderMessage(invoice, outstanding, customerName) {
      const due = invoice.dueDate || invoice.date || "";
      return `Postovani ${customerName || "klijent"}, podsjetnik za racun ${invoice.number} na iznos ${fmtEur(outstanding)}. Rok placanja: ${due}. Hvala.`;
    }

    function createReminderForInvoice(id) {
      const invoice = state.data.invoices.find(i => i.id === id);
      if (!invoice) return;
      if (!invoice.customerId) return toast("Racun nema povezanog kupca.");
      const customer = state.data.customers.find(c => c.id === invoice.customerId);
      const stats = getInvoicePaymentStats(invoice);
      if (stats.outstanding <= 0) return toast("Racun je vec placen.");
      const reminder = {
        id: uid(),
        customerId: invoice.customerId || "",
        invoiceId: invoice.id,
        dueDate: invoice.dueDate || "",
        message: buildReminderMessage(invoice, stats.outstanding, customer?.name || invoice.customer),
        status: "pending",
        sentAt: "",
        createdAt: new Date().toISOString()
      };
      state.data.reminders.push(reminder);
      if (invoice.customerId) {
        addCustomerEvent(invoice.customerId, "Podsjetnik", `Podsjetnik za racun ${invoice.number}`, "Racun", invoice.number);
      }
      saveData();
      toast("Podsjetnik dodan.");
      render();
    }

    function sendReminder(id) {
      const reminder = state.data.reminders.find(r => r.id === id);
      if (!reminder) return;
      reminder.status = "sent";
      reminder.sentAt = new Date().toISOString();
      if (reminder.customerId) {
        addCustomerEvent(reminder.customerId, "Podsjetnik poslan", reminder.message || "", "Racun", reminder.invoiceId);
      }
      if (navigator.clipboard && reminder.message) {
        navigator.clipboard.writeText(reminder.message).catch(() => {});
      }
      saveData();
      toast("Podsjetnik oznacen kao poslan.");
      render();
    }

    function drawInvoiceChart() {
      const canvas = $("#invoiceChart");
      if (!canvas || !window.Chart) return;
      const { labels, invoiced, paid } = buildInvoiceMonthlySeries();
      if (window.invoiceChart) window.invoiceChart.destroy();
      window.invoiceChart = new Chart(canvas.getContext("2d"), {
        type: "bar",
        data: {
          labels,

    function renderAnalysis() {
      const { inventory, invoices } = state.data;
      const stockValue = inventory.reduce((sum, item) => sum + item.stock * item.cost, 0);
      const potentialRevenue = inventory.reduce((sum, item) => sum + item.stock * item.price, 0);
      const margin = potentialRevenue - stockValue;
      const salesMap = {};
      invoices.forEach(inv => inv.items.forEach(item => {
        salesMap[item.name] = (salesMap[item.name] || 0) + (item.qty || 0);
      }));
      const topSales = Object.entries(salesMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const catMap = {};
      inventory.forEach(item => { catMap[item.category] = (catMap[item.category] || 0) + item.stock; });
      const maxCat = Math.max(...Object.values(catMap), 1);
      return `
        <div class="grid three">
          <div class="card stat">
            <div class="muted">Vrijednost zaliha (nabava)</div>
            <div class="value">${fmtEur(stockValue)}</div>
          </div>
          <div class="card stat">
            <div class="muted">Potencijalna prodaja</div>
            <div class="value">${fmtEur(potentialRevenue)}</div>
          </div>
          <div class="card stat">
            <div class="muted">Potencijalna marza</div>
            <div class="value">${fmtEur(margin)}</div>
          </div>
        </div>
        <div class="grid two" style="margin-top:16px;">
          <div class="card">
            <h3>Top artikli (po racunima)</h3>
            ${topSales.length === 0 ? `<p class="muted">Nema prodaje za analizu.</p>` : `
              <div class="list">
                ${topSales.map(([name, qty]) => `
                  <div class="list-item">
                    <div class="row space align">
                      <strong>${name}</strong>
                      <span class="pill">${qty} kom</span>
                    </div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
          <div class="card">
            <h3>Zalihe po kategorijama</h3>
            ${Object.keys(catMap).length === 0 ? `<p class="muted">Nema kategorija.</p>` : `
              <div class="list">
                ${Object.entries(catMap).map(([cat, qty]) => `
                  <div class="list-item">
                    <div class="row space align">
                      <strong>${cat}</strong>
                      <span class="pill">${qty} kom</span>
                    </div>
                    <div class="bar"><span style="width:${(qty / maxCat) * 100}%"></span></div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function getSelectedProject() {
      const projects = state.data.projects || [];
      if (!projects.length) return null;
      let project = projects.find(p => p.id === state.selectedProjectId);
      if (!project) {
        project = projects[0];
        state.selectedProjectId = project.id;
      }
      return project;
    }

    function addProject() {
      const nameInput = $("#project_new_name");
      const descInput = $("#project_new_desc");
      const name = nameInput ? nameInput.value.trim() : "";
      if (!name) return toast("Upisite naziv projekta.");
      const desc = descInput ? descInput.value.trim() : "";
      const project = {
        id: uid(),
        name,
        description: desc,
        tiers: { basic: [], standard: [], premium: [] }
      };
      state.data.projects.push(project);
      state.selectedProjectId = project.id;
      saveData();
      render();
    }

    function deleteProject(id) {
      if (!confirm("Obrisati projekt?")) return;
      state.data.projects = state.data.projects.filter(p => p.id !== id);
      state.selectedProjectId = state.data.projects[0]?.id || "";
      saveData();
      render();
    }

    function duplicateProject(id) {
      const project = state.data.projects.find(p => p.id === id);
      if (!project) return;
      const copy = clone(project);
      copy.id = uid();
      copy.name = `${project.name} (kopija)`;
      state.data.projects.push(copy);
      state.selectedProjectId = copy.id;
      saveData();
      render();
    }

    function addTierItem(tier, mode) {
      const project = getSelectedProject();
      if (!project) return;
      if (!project.tiers[tier]) project.tiers[tier] = [];
      if (mode === "inventory") {
        const select = $(`#tier_${tier}_select`);
        const qtyInput = $(`#tier_${tier}_qty`);
        const priceInput = $(`#tier_${tier}_price`);
        const id = select.value;
        if (!id) return toast("Odaberite artikl.");
        const item = state.data.inventory.find(i => i.id === id);
        const qty = Number(qtyInput.value || 0);
        if (qty <= 0) return toast("Unesite kolicinu.");
        const price = Number(priceInput.value || item.price);
        project.tiers[tier].push({ id, name: item.name, qty, unit: item.unit, price });
        select.value = "";
        qtyInput.value = "";
        priceInput.value = "";
      } else {
        const nameInput = $(`#tier_${tier}_manual_name`);
        const qtyInput = $(`#tier_${tier}_manual_qty`);
        const priceInput = $(`#tier_${tier}_manual_price`);
        const unitInput = $(`#tier_${tier}_manual_unit`);
        const name = nameInput.value.trim();
        const qty = Number(qtyInput.value || 0);
        if (!name) return toast("Upisite naziv.");
        if (qty <= 0) return toast("Unesite kolicinu.");
        project.tiers[tier].push({
          id: null,
          name,
          qty,
          unit: unitInput.value.trim() || "kom",
          price: Number(priceInput.value || 0)
        });
        nameInput.value = "";
        qtyInput.value = "";
        priceInput.value = "";
        unitInput.value = "";
      }
      saveData();
      render();
    }

    function removeTierItem(tier, index) {
      const project = getSelectedProject();
      if (!project) return;
      project.tiers[tier].splice(Number(index), 1);
      saveData();
      render();
    }

      const project = getSelectedProject();
      if (!project) {
        return `
          <div class="card">

          </div>
        `;
      }
      return `
        <div class="grid two">
          <div class="card">
            <h2>Usporedba ponuda</h2>
            <label>Projekt</label>
            <select id="project_select">
              ${state.data.projects.map(p => `<option value="${p.id}" ${p.id === project.id ? "selected" : ""}>${p.name}</option>`).join("")}
            </select>
            <div class="divider"></div>
            <label>Naziv projekta</label>
            <input id="project_name" value="${project.name}" />
            <label style="margin-top:8px;">Opis</label>
            <input id="project_desc" value="${project.description || ""}" />
            <div class="row" style="margin-top:12px;">
              <button class="btn" data-action="duplicate-project" data-id="${project.id}">Dupliciraj</button>
              <button class="btn danger" data-action="delete-project" data-id="${project.id}">Obrisi</button>
            </div>
          </div>
          <div class="card">
            <h3>Novi projekt</h3>
            <label>Naziv</label>
            <input id="project_new_name" placeholder="Novi projekt" />
            <label style="margin-top:8px;">Opis</label>
            <input id="project_new_desc" placeholder="Kratki opis" />
            <button class="btn primary" style="margin-top:12px;" data-action="add-project">Dodaj projekt</button>
          </div>
        </div>
        <div class="row align" style="margin-top:16px;">
          <label class="switch">
            <input type="checkbox" id="edit_tiers_toggle" ${state.editTiers ? "checked" : ""} />
            <span class="slider"></span>
            <span class="switch-text">Uredi rangove ugradnje</span>

          ${["basic", "standard", "premium"].map(tier => renderTierCard(project, tier)).join("")}

    async function exportDocumentPDF(doc, type) {
      if (!window.jspdf || !window.html2canvas) {
        toast("PDF biblioteka nije dostupna.");
        return;
      }
      let wrapper;
      try {
        toast("Izrada PDF-a...");
        const html = buildDocumentHTML(doc, type);
        wrapper = document.createElement("div");
        wrapper.style.position = "fixed";
        wrapper.style.left = "-9999px";
        wrapper.style.top = "0";
        wrapper.style.width = "800px";
        wrapper.style.background = "#ffffff";
        wrapper.innerHTML = html;
        document.body.appendChild(wrapper);

        const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: "#ffffff" });
        const imgData = canvas.toDataURL("image/png");
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const imgWidth = pageWidth;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;

        let heightLeft = imgHeight;
        let position = 0;
        pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;

        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        const filePrefix = type === "offer" ? "ponuda" : "racun";
        const safeNumber = String(doc.number || "dokument").replace(/[^a-zA-Z0-9_-]+/g, "-");
        pdf.save(`${filePrefix}_${safeNumber}.pdf`);
      } catch (err) {
        console.error(err);
        toast("Greska pri izradi PDF-a.");
      } finally {
        if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
      }
    }

    function updateStockFromInvoice(invoice) {
      if (!state.data.settings.autoStock) return;
      invoice.items.forEach(item => {
        const invItem = state.data.inventory.find(i => i.id === item.id);
        if (invItem) {
          invItem.stock = Math.max(0, Number(invItem.stock) - Number(item.qty || 0));
        }
      });
    }

    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]");
      if (!action) return;
      const name = action.dataset.action;
      if (name === "switch-view") return setView(action.dataset.view);
      if (name === "new-offer") {
        state.draftOffer = createOfferDraft();
        setView("offers");
        return;
      }
      if (name === "new-invoice") {
        state.draftInvoice = createInvoiceDraft();
        setView("invoices");
        return;
      }
      if (name === "open-settings") return openSettings();
      if (name === "close-modal") return closeModal();
      if (name === "add-offer-item") return addOfferItem();
      if (name === "add-offer-manual") return addOfferManual();
      if (name === "add-invoice-item") return addInvoiceItem();
      if (name === "add-invoice-manual") return addInvoiceManual();
      if (name === "pdf-offer") return exportOfferPDF(action.dataset.id);
      if (name === "save-offer") return saveOffer();

      state.data.offers.push(offer);
      if (offer.customerId) {
        addCustomerEvent(offer.customerId, "Ponuda", `Ponuda ${offer.number}`, "Ponuda", offer.number);

      const offer = state.data.offers.find(o => o.id === id);

      state.draftInvoice = {
        ...createInvoiceDraft(),
        customerId: offer.customerId || "",
        projectId: offer.projectId || "",
        customer: offer.customer,
        phone: offer.phone,
        address: offer.address,
        items: offer.items.map(i => ({ ...i })),
        notes: offer.notes,
        discount: offer.discount,
        rebatePct: offer.rebatePct || 0,
        vatRate: offer.vatRate
      };
      setView("invoices");
    }

    function duplicateOffer(id) {
      const offer = state.data.offers.find(o => o.id === id);
      if (!offer) return;
      const copy = { ...offer, id: uid(), number: nextOfferNumber(), date: todayISO() };
      state.data.offers.push(copy);
      saveData();
      render();
      toast("Ponuda duplicirana.");

      state.draftInvoice = {

        customerId: offer.customerId || "",
        projectId: offer.projectId || "",
        customer: offer.customer,
        phone: offer.phone,
        address: offer.address,

    function saveInvoice() {
      if (!state.draftInvoice.customer) return toast("Upisite klijenta.");
      if (!state.draftInvoice.items.length) return toast("Dodajte barem jednu stavku.");
      const invoice = { ...state.draftInvoice };
      invoice.number = finalizeInvoiceNumber(state.draftInvoice.number);
      if (!Array.isArray(invoice.payments)) invoice.payments = [];
      if (invoice.paid && invoice.payments.length === 0) {
        const total = calcTotals(invoice.items, invoice.discount, invoice.vatRate, invoice.rebatePct || 0).total;
        invoice.payments.push({
          id: uid(),
          amount: total,
          date: invoice.date || todayISO(),
          note: "Uplata u cijelosti"
        });
      }
      state.data.invoices.push(invoice);
      updateStockFromInvoice(invoice);
      if (invoice.customerId) {
        addCustomerEvent(invoice.customerId, "Racun", `Racun ${invoice.number}`, "Racun", invoice.number);
      }
      state.draftInvoice = createInvoiceDraft();
      saveData();
      toast("Racun spremljen.");
      render();
    }

          <div>
            <label>Iznos uplate (EUR)</label>
            <input id="payment_amount" type="number" min="0" step="0.01" />
            <label style="margin-top:8px;">Datum uplate</label>
            <input id="payment_date" type="date" value="${todayISO()}" />
            <label style="margin-top:8px;">Napomena</label>
            <input id="payment_note" placeholder="Npr. uplata 30%" />
            <button class="btn primary" style="margin-top:10px;" data-action="add-payment" data-id="${invoice.id}">Dodaj uplatu</button>
          </div>
        </div>
        <div class="divider"></div>
        <h4>Povijest uplata</h4>
        ${payments.length ? `
          <div class="list">
            ${payments.map((p, idx) => `
              <div class="list-item">
                <div class="row space align">
                  <strong>${fmtEur(p.amount)}</strong>
                  <span class="pill">${p.date || "-"}</span>
                </div>
                <div class="muted">${p.note || ""}</div>
                <button class="btn small danger" data-action="remove-payment" data-id="${invoice.id}" data-index="${idx}">Ukloni</button>
              </div>
            `).join("")}
          </div>
        ` : `<p class="muted">Nema uplata.</p>`}
      `);
    }

    function addPayment(id) {
      const invoice = state.data.invoices.find(i => i.id === id);
      if (!invoice) return;
      const amount = Number($("#payment_amount").value || 0);
      if (amount <= 0) return toast("Unesite iznos uplate.");
      const payment = {
        id: uid(),
        amount,
        date: $("#payment_date").value || todayISO(),
        note: $("#payment_note").value.trim()
      };
      invoice.payments = Array.isArray(invoice.payments) ? invoice.payments : [];
      invoice.payments.push(payment);
      const stats = getInvoicePaymentStats(invoice);
      invoice.paid = stats.outstanding <= 0;
      if (invoice.customerId) {
        addCustomerEvent(invoice.customerId, "Uplata", `Uplata ${fmtEur(amount)} za racun ${invoice.number}`, "Racun", invoice.number);
      }
      saveData();
      openPaymentModal(id);
      render();
    }

    function removePayment(id, index) {
      const invoice = state.data.invoices.find(i => i.id === id);
      if (!invoice || !Array.isArray(invoice.payments)) return;
      invoice.payments.splice(Number(index), 1);
      const stats = getInvoicePaymentStats(invoice);
      invoice.paid = stats.outstanding <= 0;
      saveData();
      openPaymentModal(id);
      render();
    }

    function deleteInvoice(id) {
      state.data.invoices = state.data.invoices.filter(i => i.id !== id);
      saveData();
      render();
    }

    function addInventory() {
      const name = $("#inv_name").value.trim();
      if (!name) return toast("Upisite naziv artikla.");
      const cost = Number($("#inv_cost").value || 0);
      const supplierDiscountPct = Number($("#inv_supplier_discount").value || 0);
      const netCost = cost * (1 - supplierDiscountPct / 100);
      const price = Number($("#inv_price").value || 0);
      const marginPct = netCost > 0 ? Math.round(((price - netCost) / netCost) * 1000) / 10 : 0;
      const groupName = $("#inv_group").value.trim() || "Ostalo";
      const newItem = {
        id: uid(),
        name,
        category: groupName,
        groupName,
        code: $("#inv_code").value.trim(),
        brand: $("#inv_brand").value.trim(),
        catalogNo: $("#inv_catalog").value.trim(),
        unit: $("#inv_unit").value.trim() || "kom",
        stock: Number($("#inv_stock").value || 0),
        cost,
        price,
        supplierDiscountPct,
        marginPct,
        minQty: Number($("#inv_min_qty").value || 0),
        maxQty: Number($("#inv_max_qty").value || 0),
        tier: "standard",
        webshop: $("#inv_webshop").value === "true"
      };
      state.data.inventory.push(newItem);
      saveData();
      render();
      toast("Artikl dodan.");
    }

    function deleteInventory(id) {
      state.data.inventory = state.data.inventory.filter(i => i.id !== id);
      saveData();
      render();
    }

    function tierToOffer(tier) {
      const project = getSelectedProject();
      if (!project) return;
      const items = (project.tiers?.[tier] || []).map(item => ({ ...item, id: item.id || null }));
      state.draftOffer = {
        ...createOfferDraft(),
        items,
        notes: `Ponuda prema projektu: ${project.name} (${tier})`
      };
      setView("offers");
    }

    function bundleAddItem() {
      const input = $("#bundle_item_input");
      const value = input.value.trim();
      if (!value) return toast("Upisite stavku.");
      state.draftBundle.items.push(value);
      input.value = "";
      render();
    }

    function bundleRemoveItem(index) {
      state.draftBundle.items.splice(Number(index), 1);
      render();
    }

    function saveBundle() {
      if (!state.draftBundle.name) return toast("Upisite naziv paketa.");
      const existing = state.data.bundles.find(b => b.id === state.draftBundle.id);
      if (existing) {
        Object.assign(existing, clone(state.draftBundle));
      } else {
        state.data.bundles.push(clone(state.draftBundle));
      }
      saveData();
      state.draftBundle = createBundleDraft();
      render();
      toast("Paket spremljen.");
    }

    function resetBundle() {
      state.draftBundle = createBundleDraft();
      render();
    }

    function editBundle(id) {
      const bundle = state.data.bundles.find(b => b.id === id);
      if (!bundle) return;
      state.draftBundle = createBundleDraft(bundle);
      render();
    }

    function deleteBundle(id) {
      if (!confirm("Obrisati paket?")) return;
      state.data.bundles = state.data.bundles.filter(b => b.id !== id);
      saveData();
      render();
    }

    function bundleToOffer(id) {
      const bundle = state.data.bundles.find(b => b.id === id);
      if (!bundle) return;
      const parts = [];
      if (bundle.description) parts.push(bundle.description);
      if (bundle.items.length) parts.push(`Ukljucuje: ${bundle.items.join(", ")}`);
      state.draftOffer = {
        ...createOfferDraft(),
        items: [{ id: null, name: bundle.name, qty: 1, unit: "paket", price: bundle.price }],
        notes: parts.join("\n")
      };
      setView("offers");
    }

    function addSupplierItem() {
      const name = $("#supplier_item_name").value.trim();
      if (!name) return toast("Upisite naziv artikla.");
      const item = {
        id: uid(),
        supplier: $("#supplier_name").value.trim(),
        name,
        sku: $("#supplier_sku").value.trim(),
        unit: $("#supplier_unit").value.trim() || "kom",
        cost: Number($("#supplier_cost").value || 0),
        marginPct: Number($("#supplier_margin").value || 0),
        planQty: Number($("#supplier_qty").value || 0),
        leadTime: $("#supplier_lead").value.trim(),
        notes: $("#supplier_notes").value.trim()
      };
      state.data.supplierCatalog.push(item);
      saveData();
      render();
      toast("Dodano u cjenik.");
    }

    function deleteSupplierItem(id) {
      state.data.supplierCatalog = (state.data.supplierCatalog || []).filter(i => i.id !== id);
      saveData();
      render();
    }

    function supplierToInventory(id) {
      const item = (state.data.supplierCatalog || []).find(i => i.id === id);
      if (!item) return;
      const cost = Number(item.cost || 0);
      const price = cost > 0 ? cost * (1 + (Number(item.marginPct || 0) / 100)) : 0;
      state.data.inventory.push({
        id: uid(),
        name: item.name,
        category: "Dobavljac",
        sku: item.sku,
        unit: item.unit || "kom",
        stock: 0,
        cost,
        price,
        marginPct: item.marginPct || 0,
        tier: "standard",
        webshop: false
      });
      saveData();
      render();
      toast("Dodano u lager.");
    }

    function parseCSV(text) {
      const rows = [];
      let current = "";
      let inQuotes = false;
      const result = [];
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"' && inQuotes && next === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "\n" && !inQuotes) {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }
      if (current) result.push(current);
      result.forEach(line => {
        const delim = line.includes(";") ? ";" : ",";
        const cols = [];
        let col = "";
        let quoted = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          const nxt = line[i + 1];
          if (ch === '"' && quoted && nxt === '"') {
            col += '"';
            i++;
          } else if (ch === '"') {
            quoted = !quoted;
          } else if (ch === delim && !quoted) {
            cols.push(col.trim());
            col = "";
          } else {
            col += ch;
          }
        }
        cols.push(col.trim());
        if (cols.some(v => v !== "")) rows.push(cols);
      });
      return rows;
    }

    function importSupplierCSV(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result || "";
        const rows = parseCSV(text);
        if (!rows.length) return toast("CSV je prazan.");
        const header = rows[0].map(h => h.toLowerCase());
        const hasHeader = header.some(h => h.includes("naziv") || h.includes("name") || h.includes("cijena") || h.includes("cost"));
        const dataRows = hasHeader ? rows.slice(1) : rows;
        dataRows.forEach(cols => {
          const get = (name, fallbackIdx) => {
            const idx = header.findIndex(h => h.includes(name));
            if (idx >= 0) return cols[idx];
            return cols[fallbackIdx] || "";
          };
          const item = {
            id: uid(),
            supplier: hasHeader ? get("dobav", 0) : "",
            name: hasHeader ? (get("naziv", 1) || get("name", 1)) : (cols[0] || ""),
            sku: hasHeader ? get("sku", 2) : (cols[1] || ""),
            unit: hasHeader ? (get("jed", 3) || "kom") : (cols[2] || "kom"),
            cost: Number(hasHeader ? (get("cijen", 4) || get("cost", 4)) : (cols[3] || 0)) || 0,
            marginPct: Number(hasHeader ? (get("mar", 5) || 0) : (cols[4] || 0)) || 0,
            planQty: Number(hasHeader ? (get("kol", 6) || 0) : (cols[5] || 0)) || 0,
            leadTime: hasHeader ? get("rok", 7) : (cols[6] || ""),
            notes: hasHeader ? get("nap", 8) : (cols[7] || "")
          };
          if (item.name) state.data.supplierCatalog.push(item);
        });
        saveData();
        render();
        toast("Cjenik uvezen.");
      };
      reader.readAsText(file);
    }

    function parseNumber(value) {
      if (typeof value === "number") return value;
      const cleaned = String(value || "").replace(",", ".").replace(/[^0-9.\-]/g, "");
      return Number(cleaned) || 0;
    }

    function importInventoryRows(rows) {
      if (!rows.length) return toast("Datoteka nema podataka.");
      const header = rows[0].map(h => String(h || "").toLowerCase().trim());
      const hasHeader = header.some(h => h.includes("naziv") || h.includes("mpc") || h.includes("vpc") || h.includes("grupe") || h.includes("artikl"));
      const dataRows = hasHeader ? rows.slice(1) : rows;
      const idx = (keys, fallback) => {
        const i = header.findIndex(h => keys.some(k => h.includes(k)));
        return i >= 0 ? i : fallback;
      };
      const idxCode = idx(["artikl", "sifra", "code"], 0);
      const idxName = idx(["naziv artikla", "naziv", "name"], 1);
      const idxBrand = idx(["robne marke", "marka", "brand"], 2);
      const idxCatalog = idx(["katalo", "catalog"], 3);
      const idxQty = idx(["kolic", "kol"], 4);
      const idxGroup = idx(["grupe", "group"], 5);
      const idxVPC = idx(["vpc", "nabavn"], 6);
      const idxMPC = idx(["mpc", "prodajn"], 7);
      const idxDiscount = idx(["rabat", "popust"], -1);
      const idxMargin = idx(["marz", "margin"], -1);
      const idxMin = idx(["min"], -1);
      const idxMax = idx(["max"], -1);
      const idxUnit = idx(["jed", "unit"], -1);

      dataRows.forEach(cols => {
        const code = (cols[idxCode] || "").toString().trim();
        const name = (cols[idxName] || "").toString().trim();
        if (!name && !code) return;
        const brand = (idxBrand >= 0 ? cols[idxBrand] : "") || "";
        const catalogNo = (idxCatalog >= 0 ? cols[idxCatalog] : "") || "";
        const groupName = ((idxGroup >= 0 ? cols[idxGroup] : "") || "Ostalo").toString().trim();
        const stock = parseNumber(idxQty >= 0 ? cols[idxQty] : 0);
        const cost = parseNumber(idxVPC >= 0 ? cols[idxVPC] : 0);
        const price = parseNumber(idxMPC >= 0 ? cols[idxMPC] : 0);
        const supplierDiscountPct = parseNumber(idxDiscount >= 0 ? cols[idxDiscount] : 0);
        const unit = (idxUnit >= 0 ? cols[idxUnit] : "kom") || "kom";
        const minQty = parseNumber(idxMin >= 0 ? cols[idxMin] : 0);
        const maxQty = parseNumber(idxMax >= 0 ? cols[idxMax] : 0);

        const netCost = cost * (1 - supplierDiscountPct / 100);
        let marginPct = parseNumber(idxMargin >= 0 ? cols[idxMargin] : 0);
        let finalPrice = price;
        if (!finalPrice && marginPct) {
          finalPrice = netCost * (1 + marginPct / 100);
        }
        if (!marginPct && finalPrice && netCost > 0) {
          marginPct = Math.round(((finalPrice - netCost) / netCost) * 1000) / 10;
        }

        const existing = state.data.inventory.find(item =>
          (code && item.code === code) ||
          (catalogNo && item.catalogNo === catalogNo) ||
          (name && item.name === name)
        );
        if (existing) {
          existing.code = code || existing.code;
          existing.name = name || existing.name;
          existing.brand = brand || existing.brand;
          existing.catalogNo = catalogNo || existing.catalogNo;
          existing.groupName = groupName || existing.groupName;
          existing.category = groupName || existing.category;
          existing.unit = unit || existing.unit;
          if (stock) existing.stock = stock;
          if (cost) existing.cost = cost;
          if (finalPrice) existing.price = finalPrice;
          existing.supplierDiscountPct = supplierDiscountPct;
          existing.marginPct = marginPct || existing.marginPct;
          existing.minQty = minQty || existing.minQty;
          existing.maxQty = maxQty || existing.maxQty;
        } else {
          state.data.inventory.push({
            id: uid(),
            code,
            name,
            brand,
            catalogNo,
            groupName,
            category: groupName,
            unit,
            stock,
            cost,
            price: finalPrice,
            supplierDiscountPct,
            marginPct,
            minQty,
            maxQty,
            tier: "standard",
            webshop: false
          });
        }
      });
      saveData();
      render();
      toast("Artikli uvezeni.");
    }

    function importInventoryFile(file) {
      const ext = file.name.split(".").pop().toLowerCase();
      if ((ext === "xlsx" || ext === "xls") && window.XLSX) {
        const reader = new FileReader();
        reader.onload = () => {
          const data = new Uint8Array(reader.result);
          const wb = XLSX.read(data, { type: "array" });
          const sheetName = wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
          importInventoryRows(rows);
        };
        reader.readAsArrayBuffer(file);
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const rows = parseCSV(reader.result || "");
        importInventoryRows(rows);
      };
      reader.readAsText(file);
    }

    function openReorderReport() {
      const items = state.data.inventory.filter(item => (item.minQty || 0) > 0 && (item.stock || 0) < (item.minQty || 0));
      if (!items.length) return toast("Nema stavki ispod minimuma.");
      state.reorderDraft = {
        items: items.map(item => {
          const maxQty = Number(item.maxQty || 0);
          const minQty = Number(item.minQty || 0);
          const stock = Number(item.stock || 0);
          const suggested = maxQty > 0 ? Math.max(0, maxQty - stock) : Math.max(0, minQty - stock);
          return {
            id: item.id,
            code: item.code || item.sku || "",
            name: item.name,
            groupName: item.groupName || item.category || "",
            cost: item.cost || 0,
            supplierDiscountPct: item.supplierDiscountPct || 0,
            qty: suggested
          };
        })
      };
      openModal("Izvjestaj nabave", `
        <div class="list">
          ${state.reorderDraft.items.map(item => {
            const netCost = (item.cost || 0) * (1 - (item.supplierDiscountPct || 0) / 100);
            return `
              <div class="list-item">
                <div class="row space align">
                  <strong>${item.name}</strong>
                  <span class="pill">${item.groupName}</span>
                </div>
                <div class="muted">Sifra: ${item.code || "-"} · Nabavna (neto): ${fmtEur(netCost)}</div>
                <div class="row align">
                  <label style="min-width:140px;">Kolicina za narudzbu</label>
                  <input type="number" min="0" step="0.1" value="${item.qty}" data-reorder-id="${item.id}" />
                  <span class="pill">Ukupno: ${fmtEur(netCost * item.qty)}</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <div class="divider"></div>
        <div class="row space align">
          <strong>Ukupni trosak nabave:</strong>
          <strong id="reorder_total">0</strong>
        </div>
      `);
      updateReorderTotal();
    }

    function updateReorderTotal() {
      const total = (state.reorderDraft?.items || []).reduce((sum, item) => {
        const netCost = (item.cost || 0) * (1 - (item.supplierDiscountPct || 0) / 100);
        return sum + netCost * (item.qty || 0);
      }, 0);
      const el = $("#reorder_total");
      if (el) el.textContent = fmtEur(total);
    }

    function addToCart(id) {
      const existing = state.cart.find(ci => ci.id === id);
      if (existing) existing.qty += 1;
      else state.cart.push({ id, qty: 1 });
      render();
      toast("Dodano u kosaricu.");
    }

    function updateCart(id, qty) {
      const item = state.cart.find(ci => ci.id === id);
      if (!item) return;
      item.qty = Math.max(1, Number(qty || 1));
      render();
    }

    function removeFromCart(id) {
      state.cart = state.cart.filter(ci => ci.id !== id);
      render();
    }

    function checkout() {
      if (!state.cart.length) return toast("Kosarica je prazna.");
      const customer = $("#shop_customer").value.trim();
      if (!customer) return toast("Upisite ime kupca.");
      const phone = $("#shop_phone").value.trim();
      const address = $("#shop_address").value.trim();
      const products = state.data.inventory;
      const items = state.cart.map(ci => {
        const p = products.find(prod => prod.id === ci.id);
        return { id: p.id, name: p.name, qty: ci.qty, unit: p.unit, price: p.price };
      });
      const total = calcTotals(items, 0, 0, 0).total;
      const order = {
        id: uid(),
        number: "WEB-" + Date.now().toString().slice(-6),
        date: todayISO(),
        customer,
        phone,
        address,
        items,
        total
      };
      state.data.orders.push(order);
      state.cart = [];
      saveData();
      render();
      toast("Narudzba spremljena.");
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `vodopro_backup_${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          state.data = normalizeData(parsed);
          saveData();
          render();
          toast("Podaci uvezeni.");
        } catch (err) {
          toast("Greska pri uvozu.");
        }
      };
      reader.readAsText(file);
    }

    function resetData() {
      if (!confirm("Sigurno zelite obrisati sve podatke?")) return;
      state.data = normalizeData({});
      saveData();
      render();
      toast("Podaci resetirani.");
    }

    render();
  </script>
